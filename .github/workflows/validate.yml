name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Python syntax check
        run: python -m compileall -q app tests
      - name: MQL structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mt5/stable/InstitutionalSMC_SequenceEA_v3_27_ReactionWindow_Demo.mq5')
          text=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert text.count(a)==text.count(b),(a,b,text.count(a),text.count(b))
          assert '#property version   "3.27"' in text
          assert 'TZ_BuildEscapePullback' in text
          assert 'gate_stage' in text and 'gate_reason' in text
          print('MQL structural checks OK')
          PY
      - name: Stable EA SHA256
        run: sha256sum mt5/stable/InstitutionalSMC_SequenceEA_v3_27_ReactionWindow_Demo.mq5
