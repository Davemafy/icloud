name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Python syntax check
        run: python -m compileall -q app tests
      - name: MQL structural checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          seq=next(x for x in manifest['files'] if x.get('role')=='sequence_ea')
          p=Path(seq['path'])
          text=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert text.count(a)==text.count(b),(a,b,text.count(a),text.count(b))
          assert f'#property version   "{manifest["sequence_ea_version"]}"' in text
          required=[
              'HTF_ZONE_CONTACT_HANDOFF',
              'TZ60_ScanPrimaryEngine',
              'TZ60_FindNearestMicroSwing',
              'TZ60_FindRetestedCausalPD',
              'TZ60_BuildEngulfing',
              'TZ63_ModelSpecificConfirmationReady',
              'TZ62_BuildDisplacementContinuation',
              'TZ62_BuildInstitutionalBreakout',
              'owner_mirror_campaign_key',
              'SniperPullbackMaxBars',
              'SniperConfirmMaxBars',
              'trace_sweep_price',
              'trace_sweep_reject_reason',
              'trace_sweep_candidate_clearance_points',
              'opportunity_slot',
              'execution_context_type',
              'execution_context_zone_id',
              'execution_context_contract_verified',
              'trace_mss_level',
              'trace_pd_low',
              'MASTER_SNIPER_PD_',
              'ZONE_ENGULFING',
              'ZONE_ENGULFING_RETEST',
              'TZ70_BuildEngulfingRetest',
              'TZ69_ProtectedSwingExecutionStop',
              'TZ69_FindProtectedSwing',
              'TZ46_ZoneStopBuffer',
              'TZ49_OpenDirectionalTargets',
              'TZ49_DeepestDirectionalTarget',
              'MIN_RR_NOT_MET:RR=',
              'last_candidate_rr_required',
              'M1_PROTECTED_SWING_HIGH',
              'M1_PROTECTED_SWING_LOW',
              'last_candidate_swing_level',
              'TZ28_ArmAcceptedFlip',
              'LIQUIDITY_REVERSAL_HANDOFF',
              'MT5_EXECUTION_OWNER_MIRROR_V1',
              'ENTRY_CONFIRMATION',
              'FLIP_CONFIRMATION',
              'OrderCalcProfit',
              'TZ37_SendOrders',
          ]
          for needle in required:
              assert needle in text, needle
          assert 'TZ62_UniversalM1ShiftReady' not in text
          assert 'ENGULFING_WAITING_FOR_M1_MICRO_STRUCTURE_SHIFT' not in text
          assert 'stage="BREAKOUT_M1_MICRO_SHIFT"' not in text
          evaluate=text[text.index('void Evaluate()'):text.index('\nint OnInit()',text.index('void Evaluate()'))]
          assert 'TZ48_EntrySpecificRunwayValid' not in evaluate
          assert 'TZ46_InitialZoneProtectedStop(sig.buy,microSl,g_plan.zone_low,g_plan.zone_high,a)' not in evaluate
          assert 'TZ69_ProtectedSwingExecutionStop(r,sig.buy,entry,a,stopSwingIdx,stopSwingLevel)' in evaluate
          assert 'TZ68_M1ExecutionStop(sig.buy,sig.anchor_price,a)' not in evaluate
          assert 'PROTECTED_M1_SWING_STOP_UNAVAILABLE' in evaluate
          print(f'Stable Sequence {manifest["sequence_ea_version"]} MQL structural checks OK: {p.name}')
          PY
      - name: Stable EA SHA256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          seq=next(x for x in manifest['files'] if x.get('role')=='sequence_ea')
          data=Path(seq['path']).read_bytes()
          actual=hashlib.sha256(data).hexdigest()
          assert actual==seq['sha256'], (actual,seq['sha256'])
          print(actual, seq['path'])
          PY
