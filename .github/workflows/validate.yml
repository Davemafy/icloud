name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Python syntax check
        run: python -m compileall -q app tests
      - name: MQL structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mt5/stable/InstitutionalSMC_SequenceEA_v3_40_AcceptedBreakerFlip_Demo.mq5')
          text=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert text.count(a)==text.count(b),(a,b,text.count(a),text.count(b))
          assert '#property version   "3.40"' in text
          required=[
              'TZ_BuildEscapePullback',
              'TZ28_ArmAcceptedFlip',
              'TZ31_RefreshCloudState',
              'Persist/release the owner mirror even while execution is safety-blocked.',
              'TZ31_BuildPostHandoffContinuation',
              'HTF_ZONE_SWEEP_HANDOFF',
              'LIQUIDITY_REVERSAL_HANDOFF',
              'MT5_EXECUTION_OWNER_MIRROR_V1',
              'owner_mirror_zone_payload_b64',
              'FileDelete("TradeZone\\\\execution_owner_state.txt")',
              'execution_handoff_ts',
              'gate_stage',
              'gate_reason',
              'ENTRY_CONFIRMATION',
              'FLIP_CONFIRMATION',
              'WAITING_FOR_CLOSED_M1_VALUE_REACTION',
              'NO_OPEN_TARGET_BEYOND_ENTRY',
              'MT5_ORDER_SEND_FAILED',
              'TZ34_InitialRiskDistance',
              'HistorySelectByPosition(positionId)',
              'RunnerTrailStartR',
              'TZ39_ProfessionalValueReactionReady',
              'TZ39_InitialEntryReady',
              'TZ39_FlipEntryReady',
              'TZ40_FailedZoneBreakerPD',
              'TZ40_BreakerFlipReady',
              'BREAKER_RETEST_MSS_DISPLACEMENT_CONFIRMED',
              'ENTRY_CONFIRMATION',
              'FLIP_CONFIRMATION',
              'ProfessionalEntryReactionMinBodyATR=0.25',
              'ProfessionalEntryReactionMaxChaseATR=0.15',
          ]
          for needle in required:
              assert needle in text, needle
          print('Sequence 3.40 MQL structural checks OK')
          PY
      - name: Stable EA SHA256
        run: sha256sum mt5/stable/InstitutionalSMC_SequenceEA_v3_40_AcceptedBreakerFlip_Demo.mq5
