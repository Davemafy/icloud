name: validate-reaction-window-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  focused-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Reaction-window cloud tests
        run: pytest -q tests/test_watch_ready.py tests/test_zone_sweep_owner_freeze.py tests/test_execution_safety.py tests/test_execution_owner_mirror.py tests/test_service_ai_fallback.py tests/test_execution_pipeline_integration.py tests/test_spread_safety_thesis_persistence.py tests/test_owner_authority_continuity.py tests/test_live_ownership_sync.py tests/test_dashboard_view.py tests/test_journal_current_tags.py tests/test_journal_durability.py tests/test_journal_objective_truth.py tests/test_databridge_137_source.py tests/test_databridge_139_source.py tests/test_databridge_140_source.py tests/test_databridge_141_source.py tests/test_databridge_142_source.py tests/test_databridge_143_source.py tests/test_journal_provenance.py tests/test_sequence_335_source.py tests/test_sequence_334_source.py tests/test_sequence_333_source.py tests/test_sequence_332_source.py tests/test_sequence_331_source.py tests/test_sequence_330_source.py tests/test_sequence_329_source.py tests/test_sequence_328_source.py tests/test_version_truth_local_manifest.py tests/test_professional_release_contract.py
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: DataBridge 1.43 structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mt5/stable/InstitutionalSMC_DataBridge_v1_43_Sequence335Truth.mq5')
          t=p.read_text(encoding='utf-8')
          core=Path('mt5/stable/InstitutionalSMC_DataBridge_v1_31_XAU_DXY_Journal.mq5').read_text(encoding='utf-8')
          for text in (t, core):
              for a,b in [('(',')'),('{','}'),('[',']')]:
                  assert text.count(a)==text.count(b),(a,b,text.count(a),text.count(b))
          for needle in [
              '#property version "1.43"',
              '#define TZ_BRIDGE_VERSION "1.43"',
              '#define TZ_SEQUENCE_EXPECTED "3.35"',
              'BackfillJournalHistory(false);',
              'TZ_SendHeartbeatV143();',
              'WAITING FOR CLOSED M1 VALUE REACTION',
              'THESIS ENTRY LIMIT REACHED',
          ]:
              assert needle in t,needle
          for needle in [
              'EnableJournalHistoryBackfill',
              'CanonicalTradeId',
              'EventUidDeal',
              'SendJournalAt',
              'HistoryDealsTotal()',
              'recovered_from_mt5_history',
              'SavePositionMeta',
              'LoadPositionMeta',
              'execution_bridge_version',
              'recovery_bridge_version',
              'UNAVAILABLE_FROM_MT5_HISTORY',
              'MQLInfoInteger(MQL_TESTER)',
          ]:
              assert needle in core,needle
          assert 'IsTester()' not in core
          print('DataBridge 1.43 release structural checks OK')
          PY
          sha256sum mt5/stable/InstitutionalSMC_DataBridge_v1_43_Sequence335Truth.mq5
          sha256sum mt5/stable/InstitutionalSMC_DataBridge_v1_31_XAU_DXY_Journal.mq5
      - name: Sequence 3.35 structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mt5/stable/InstitutionalSMC_SequenceEA_v3_35_ConfirmedValueReentry_Demo.mq5')
          t=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert t.count(a)==t.count(b),(a,b,t.count(a),t.count(b))
          required=[
              '#property version   "3.35"',
              'TZ_BuildEscapePullback',
              'TZ28_ArmAcceptedFlip',
              'HTF_ZONE_SWEEP_HANDOFF',
              'MT5_EXECUTION_OWNER_MIRROR_V1',
              'TZ31_RefreshCloudState',
              'Persist/release the owner mirror even while execution is safety-blocked.',
              'TZ31_BuildPostHandoffContinuation',
              'owner_mirror_zone_payload_b64',
              'FileDelete("TradeZone\\\\execution_owner_state.txt")',
              'ACCEPTED_ZONE_FLIP_HANDOFF',
              'accepted_flip_state.txt',
              'ResearchEscapeRiskMultiplier=0.50',
              'gate_stage',
              'gate_reason',
              'SIGNAL_FOUND_WAITING_FOR_PULLBACK',
              'NO_OPEN_TARGET_BEYOND_ENTRY',
              'MT5_ORDER_SEND_FAILED',
              'TZ34_InitialRiskDistance',
              'HistorySelectByPosition(positionId)',
              'RunnerTrailStartR',
              'TZ35_ReentryEntryReady',
              'WAITING_FOR_CLOSED_M1_VALUE_REACTION',
              'PD_ARRAY_ACCEPTED_INVALIDATION',
              'REENTRY_LIMIT_REACHED',
              'ENTRY_DECISION',
          ]
          for needle in required:
              assert needle in t,needle
          print('Sequence 3.35 release structural checks OK')
          PY
      - name: SHA256
        run: sha256sum mt5/stable/InstitutionalSMC_SequenceEA_v3_35_ConfirmedValueReentry_Demo.mq5
