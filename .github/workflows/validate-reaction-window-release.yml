name: validate-reaction-window-release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  focused-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Reaction-window cloud tests
        run: pytest -q tests/test_watch_ready.py tests/test_zone_sweep_owner_freeze.py tests/test_execution_safety.py tests/test_handoff_preownership_guard.py tests/test_execution_owner_mirror.py tests/test_service_ai_fallback.py tests/test_execution_pipeline_integration.py tests/test_spread_safety_thesis_persistence.py tests/test_owner_authority_continuity.py tests/test_thesis_ownership_policy.py tests/test_live_ownership_sync.py tests/test_mt5_zone_render.py tests/test_dashboard_view.py tests/test_directional_mitigation_audit.py tests/test_institutional_two_zone.py tests/test_dynamic_continuation_zoning.py tests/test_journal_current_tags.py tests/test_journal_durability.py tests/test_journal_objective_truth.py tests/test_target_revalidation.py tests/test_databridge_137_source.py tests/test_databridge_139_source.py tests/test_databridge_140_source.py tests/test_databridge_141_source.py tests/test_databridge_142_source.py tests/test_databridge_143_source.py tests/test_databridge_144_source.py tests/test_databridge_145_source.py tests/test_databridge_146_source.py tests/test_databridge_147_source.py tests/test_databridge_148_source.py tests/test_databridge_149_source.py tests/test_databridge_153_history_window_sync.py tests/test_snapshot_history_ingress.py tests/test_journal_provenance.py tests/test_grade_risk_execution.py tests/test_sequence_340_source.py tests/test_sequence_339_source.py tests/test_sequence_338_source.py tests/test_sequence_337_source.py tests/test_sequence_336_source.py tests/test_sequence_335_source.py tests/test_sequence_334_source.py tests/test_sequence_333_source.py tests/test_sequence_332_source.py tests/test_sequence_331_source.py tests/test_sequence_330_source.py tests/test_sequence_329_source.py tests/test_sequence_328_source.py tests/test_version_truth_local_manifest.py tests/test_professional_release_contract.py tests/test_professional_zone_execution_separation.py tests/test_sequence_349_simple_micro_mss.py tests/test_sequence_350_sniper_models.py tests/test_sniper_release_payload.py
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: Verify manifest pinned-ref SHA256
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path
          manifest = json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          repo = manifest['repository']
          ref = manifest['ref']
          assert ref and ref != 'main', 'Stable manifest must pin an immutable source ref.'
          for item in [*manifest.get('files', []), *manifest.get('support_files', [])]:
              expected = str(item.get('sha256') or '').lower()
              assert expected, f"Missing SHA256 for {item.get('path')}"
              url = f"https://raw.githubusercontent.com/{repo}/{ref}/{item['path']}"
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected, f"Pinned-ref SHA mismatch for {item['path']}: expected={expected} actual={actual} ref={ref}"
          print(f"Stable manifest pinned-ref verification OK: {ref}")
          PY
      - name: Stable DataBridge structural checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          bridge=next(x for x in manifest['files'] if x.get('role')=='data_bridge')
          p=Path(bridge['path'])
          t=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert t.count(a)==t.count(b),(a,b,t.count(a),t.count(b))
          assert f'#property version "{manifest["data_bridge_version"]}"' in t
          assert f'#define TZ_BRIDGE_VERSION "{manifest["data_bridge_version"]}"' in t
          # The installer patches this source line to manifest sequence_ea_version.
          assert '#define TZ_SEQUENCE_EXPECTED "' in t
          for needle in [
              'BackfillJournalHistory(false);',
              'BackfillJournalHistory(true);',
              'JournalContinuityResyncSeconds=180',
              'gate_stage',
              'gate_reason',
              'ENTRY BLOCKED: MIN RR',
          ]:
              assert needle in t,needle
          print(f'Stable DataBridge {manifest["data_bridge_version"]} structural checks OK: {p.name}')
          PY
      - name: Stable Sequence structural checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          seq=next(x for x in manifest['files'] if x.get('role')=='sequence_ea')
          p=Path(seq['path'])
          t=p.read_text(encoding='utf-8')
          for a,b in [('(',')'),('{','}'),('[',']')]:
              assert t.count(a)==t.count(b),(a,b,t.count(a),t.count(b))
          assert f'#property version   "{manifest["sequence_ea_version"]}"' in t
          required=[
              'HTF_ZONE_CONTACT_HANDOFF',
              'TZ50_BuildSniperPD',
              'TZ50_BuildZoneEngulfing',
              'MASTER_SNIPER_PD_',
              'ZONE_ENGULFING',
              'TZ46_InitialZoneProtectedStop',
              'TZ49_OpenDirectionalTargets',
              'TZ49_DeepestDirectionalTarget',
              'MIN_RR_NOT_MET_TO_DEEPEST_OPEN_OBJECTIVE',
              'TZ28_ArmAcceptedFlip',
              'LIQUIDITY_REVERSAL_HANDOFF',
              'MT5_EXECUTION_OWNER_MIRROR_V1',
              'accepted_flip_state.txt',
              'OrderCalcProfit',
              'TZ37_SendOrders',
          ]
          for needle in required:
              assert needle in t,needle
          evaluate=t[t.index('void Evaluate()'):t.index('\nint OnInit()',t.index('void Evaluate()'))]
          assert 'TZ48_EntrySpecificRunwayValid' not in evaluate
          print(f'Stable Sequence {manifest["sequence_ea_version"]} release structural checks OK: {p.name}')
          PY
      - name: SHA256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('mt5/stable/manifest.json').read_text(encoding='utf-8'))
          for item in manifest.get('files',[]):
              actual=hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()
              assert actual==item['sha256'], (item['path'],actual,item['sha256'])
              print(actual,item['path'])
          PY
