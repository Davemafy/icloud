<!doctype html><html><head><meta charset="utf-8"><title>Institutional SMC AI Cloud v6</title><style>
body{font-family:system-ui,Arial;margin:20px;background:#111;color:#eee} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px} code,pre{white-space:pre-wrap;word-break:break-word;color:#d8f3dc} table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #333;padding:8px;text-align:left}.muted{color:#aaa}.ok{color:#9ef01a}.bad{color:#ff6b6b}
</style></head><body><h1>Institutional SMC AI Cloud v6.0</h1><p class="muted">Pre-analysis HTF core → M1 sniper execution → continuation re-entry → accepted-zone flip → thesis risk manager.</p>
<div class="grid"><div class="card"><h3>Status</h3><pre id="status">connecting…</pre></div><div class="card"><h3>Institutional brief</h3><pre id="brief">—</pre></div><div class="card"><h3>Execution contract</h3><pre id="policy">—</pre></div></div>
<h2>Dual-branch XAU zones</h2><div class="card"><table><thead><tr><th>Zone</th><th>Original</th><th>Flip</th><th>State</th><th>Core</th><th>Envelope</th><th>Grade</th><th>Type</th></tr></thead><tbody id="zones"></tbody></table></div>
<script>
const es=new EventSource('/dashboard/events');
es.addEventListener('state',e=>{const d=JSON.parse(e.data); const a=d.analysis,s=d.snapshot; document.getElementById('status').textContent=JSON.stringify({event:d.event,snapshot:s?{sent_at:s.sent_at,spread:s.spread_points,complete:true}:null,scheduler:d.scheduler},null,2); if(!a)return; document.getElementById('brief').textContent=a.trader_brief||'—';document.getElementById('policy').textContent=JSON.stringify(a.execution_policy,null,2);document.getElementById('zones').innerHTML=(a.zones||[]).map(z=>`<tr><td>${z.zone_id}</td><td>${z.original_direction}</td><td>${z.flip_direction}</td><td>${z.state}</td><td>${z.core_low}–${z.core_high}<br><small>${z.core_method}</small></td><td>${z.zone_low}–${z.zone_high}</td><td>${z.grade}</td><td>${z.setup_type}</td></tr>`).join('');});
</script></body></html>
